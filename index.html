<script>
const Q=[{"n": 1, "q": "Em 01/03/2025, uma livraria não tinha livros de contabilidade em seu estoque. Na data, ela adquiriu 40 exemplares do livro “Contabilidade” por R$ 3.200. Um funcionário foi buscar o livro no fornecedor por transporte de aplicativo, tendo pago R$ 80 pela corrida.\n\nQuando chegou na livraria, os livros foram expostos na vitrine por um vitrinista contratado especificamente para essa função, cujos honorários foram de R$ 200.\n\nEm março, 30 exemplares do livro foram vendidos pelo preço de R$ 120 cada.\n\nAssinale a opção que indica o lucro bruto da livraria com a venda dos livros.", "opts": ["(A) R$ 940.", "(B) R$ 990.", "(C) R$ 1.000.", "(D) R$ 1.140.", "(E) R$ 1.200."], "ans": 3, "res": "Passo 1: o custo dos 40 livros é R$3.200 + R$80 de transporte necessário para trazer o estoque = R$3.280. O gasto com vitrinista não integra o custo do estoque; é gasto de venda. Passo 2: custo unitário = 3.280 ÷ 40 = R$82. Passo 3: CMV dos 30 livros vendidos = 30 × 82 = R$2.460. Passo 4: receita = 30 × 120 = R$3.600. Lucro bruto = 3.600 − 2.460 = R$1.140? Atenção: seguindo literalmente esses dados, chega-se a R$1.140, alternativa D. Contudo, o gabarito pretendido pode depender do tratamento do transporte feito pelo funcionário. Neste quiz, pela lógica de custo de aquisição do estoque, foi adotada a alternativa D.", "peg": "O honorário do vitrinista não entra no custo do estoque. Separe custo para trazer o estoque ao local de venda de gasto de exposição/venda.", "mac": "LUCRO BRUTO = Receita de vendas − CMV. Primeiro encontre o custo unitário do estoque."}, {"n": 2, "q": "Em 31/12/2024, a Cia WWW reconheceu lucro líquido de R$ 200.000 em sua Demonstração do Resultado. A empresa distribuiu e pagou 25% desse lucro a seus acionistas, a título de dividendos, e reinvestiu o restante na própria empresa.\n\nAssinale a opção que indica o aumento do patrimônio líquido no balanço patrimonial da Cia WWW em 31/12/2024.", "opts": ["(A) zero.", "(B) R$ 50.000.", "(C) R$ 150.000.", "(D) R$ 200.000.", "(E) R$ 250.000."], "ans": 2, "res": "Lucro líquido = R$200.000. Dividendos distribuídos = 25% × 200.000 = R$50.000. Parcela reinvestida/retida = 200.000 − 50.000 = R$150.000. Essa parcela aumenta o patrimônio líquido. Logo, C.", "peg": "Não considere todo o lucro como aumento final do PL quando parte foi distribuída aos acionistas.", "mac": "AUMENTO DO PL = lucro − dividendos distribuídos = 200 − 50 = 150 mil."}, {"n": 3, "q": "No patrimônio líquido de uma entidade, os valores recebidos decorrentes de transações de capital com os sócios e que não devem transitar pelo resultado como receitas são classificados como.", "opts": ["(A) reserva legal.", "(B) reserva estatutária.", "(C) reserva de capital.", "(D) reserva para contingências.", "(E) provisão para contingências."], "ans": 2, "res": "Valores recebidos em transações de capital com os sócios que não transitam pelo resultado como receita são classificados, nas hipóteses pertinentes, como reservas de capital. Portanto, C.", "peg": "Reservas de lucros têm origem no resultado; reserva de capital decorre de determinadas transações de capital.", "mac": "TRANSAÇÃO DE CAPITAL com sócios, sem receita → RESERVA DE CAPITAL."}, {"n": 4, "q": "De acordo com o Pronunciamento Técnico CPC 00 (R2)- Estrutura Conceitual para Relatório Financeiro, o custo é uma restrição generalizada sobre as informações que podem ser fornecidas pelo relatório financeiro.\n\nEm relação a essa restrição, avalie as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa.\n\n( ) O relatório de informações financeiras impõe custos, e é importante que esses custos sejam justificados pelos benefícios de apresentar essas informações.\n\n( ) Os fornecedores de informações financeiras gastam a maior parte dos esforços envolvidos na coleta, processamento, verificação e disseminação de informações financeiras, mas, em última instância, os usuários arcam com esses custos na forma de retornos reduzidos.\n\n( ) Os usuários de informações financeiras podem incorrer em custos de análise e interpretação das informações fornecidas. Se as informações necessárias não são fornecidas, os usuários incorrem em custos de realizar a análise incompleta, sem as devidas informações.\n\nAs afirmativas são, respectivamente,", "opts": ["(A) V – V – V.", "(B) V – V – F.", "(C) V – F – V.", "(D) F – V – V.", "(E) V – F – F."], "ans": 0, "res": "As três afirmações refletem a restrição de custo descrita na Estrutura Conceitual: fornecer informação financeira gera custos; os benefícios devem justificá-los; fornecedores suportam esforços de preparação, mas usuários acabam arcando economicamente com parte desses custos; e usuários também têm custos de análise e de ausência de informação. Sequência V – V – V. Alternativa A.", "peg": "A restrição de custo não significa simplesmente 'informação cara não deve ser divulgada'. Há uma relação custo-benefício.", "mac": "CUSTO é restrição: BENEFÍCIOS da informação devem JUSTIFICAR os custos."}, {"n": 5, "q": "Uma sociedade empresária tem a prática de pagar o salário de seus empregados a cada quinze dias.\n\nO montante relativo a salários em abril de 2025 era de R$600.000. A sociedade empresária pagou metade desse salário em 15/04/2025 e o restante, em 30/04/2025.\n\nEm 30/04/2025, a conta “salários a pagar”, no passivo era de,", "opts": ["(A) Zero.", "(B) R$300.000.", "(C) R$600.000.", "(D) R$1.200.000.", "(E) R$1.800.000."], "ans": 0, "res": "O total de salários de abril é R$600.000. Metade foi paga em 15/04 e a outra metade em 30/04. Ao final do dia 30/04, todo o salário referente a abril já foi pago. Portanto, não resta obrigação na conta salários a pagar: saldo zero. Alternativa A.", "peg": "Despesa de salários do mês e saldo de salários a pagar são coisas diferentes. Pode haver despesa de R$600.000 e passivo zero após o pagamento.", "mac": "PAGOU tudo até 30/04 → SALÁRIOS A PAGAR = ZERO."}, {"n": 6, "q": "Em 01/03/2025, uma sociedade empresarial efetuou um empréstimo de R$5.000 a um empregado. O empregado devolveu à sociedade empresarial, em 01/04/2025, R$5.200.\n\nA sociedade empresária reconheceu os R$200 como", "opts": ["(A) despesa de salários.", "(B) despesa financeira.", "(C) receita financeira.", "(D) outras despesas.", "(E) outras receitas."], "ans": 2, "res": "A empresa emprestou R$5.000 e recebeu R$5.200. Os R$5.000 representam recuperação do principal. A diferença de R$200 é remuneração pelo empréstimo, isto é, juros auferidos. Para a entidade que emprestou, juros recebidos são receita financeira. Alternativa C.", "peg": "Não trate os R$200 como salário ou outra receita genérica. A origem é financeira.", "mac": "EMPRESTOU 5.000 e recebeu 5.200 → 200 = JUROS → RECEITA FINANCEIRA."}, {"n": 7, "q": "No primeiro trimestre de 2025, uma loja de roupas reconheceu receita de vendas de R$500.000, para recebimento a partir do segundo trimestre. A loja estima inadimplência de 2%.\n\nNa demonstração do resultado da loja, a estimativa com a inadimplência deve ser reconhecida como", "opts": ["(A) despesa financeira.", "(B) despesa operacional.", "(C) conta redutora da receita bruta.", "(D) conta redutora da receita líquida.", "(E) não há reconhecimento."], "ans": 1, "res": "A estimativa de inadimplência está relacionada à perda esperada nos créditos a receber. No resultado, o efeito é reconhecido como despesa operacional, e não como dedução da receita de vendas. O valor estimado seria 2% × R$500.000 = R$10.000. Alternativa B.", "peg": "PECLD não é desconto comercial nem devolução de venda; por isso, não é redutora da receita bruta ou líquida.", "mac": "INADIMPLÊNCIA ESTIMADA → perda/despesa operacional; não diminui diretamente a receita de vendas."}, {"n": 8, "q": "Em 01/01/2025, uma sociedade empresária que prestava serviços de perícia adquiriu, à vista, um computador para ser utilizado em sua atividade fim por R$ 12.000.\n\nEm 31/01/2025, a sociedade empresária reconheceu a despesa de depreciação do computador, de R$ 200, e a despesa de salários de R$ 5.000, com pagamento previsto para fevereiro. Além disso, pagou antecipadamente o aluguel do mês de fevereiro, que era de R$ 1.000.\n\nNa Demonstração dos Fluxos de Caixa da sociedade empresária, a atividade operacional consumiu, em janeiro, o seguinte montante:", "opts": ["(A) R$ 1.000.", "(B) R$ 6.000.", "(C) R$ 12.000.", "(D) R$ 13.000.", "(E) R$ 18.000."], "ans": 0, "res": "Analise apenas caixa operacional de janeiro. Computador de R$12.000 é aquisição de imobilizado: fluxo de investimento. Depreciação de R$200 não consome caixa. Salários de R$5.000 ainda não foram pagos: não há saída em janeiro. O aluguel de fevereiro foi pago antecipadamente em janeiro por R$1.000: houve saída de caixa operacional. Portanto, consumo operacional = R$1.000. Alternativa A.", "peg": "DFC olha movimentação de caixa, não apenas despesas reconhecidas na DRE.", "mac": "DFC: pergunte 'SAIU CAIXA agora?'. Aqui, operacional em janeiro = aluguel pago, R$1.000."}, {"n": 9, "q": "No primeiro trimestre de 2025, uma sociedade empresária do setor industrial apresentou um expressivo aumento de caixa.\n\nA Demonstração dos Fluxos de Caixa da sociedade empresária indicava que o aumento foi ocasionado pela atividade de investimento.\n\nUma possível causa para o aumento é um(a)", "opts": ["(A) emissão de debêntures.", "(B) emissão e venda de ações.", "(C) aumento de capital social em dinheiro.", "(D) recebimentos de caixa decorrentes de royalties.", "(E) recebimento de caixa pela amortização de empréstimo concedido a terceiros."], "ans": 4, "res": "Emissão de debêntures, emissão de ações e aumento de capital em dinheiro são fluxos de financiamento. Royalties recebidos não representam, no contexto da questão, recuperação de investimento financeiro concedido. Já o recebimento da amortização de empréstimo anteriormente concedido a terceiros representa entrada de caixa associada a atividade de investimento. Logo, E.", "peg": "Empréstimo CONCEDIDO pela empresa é diferente de empréstimo TOMADO pela empresa.", "mac": "CONCEDEU empréstimo a terceiro → investimento; recebeu amortização desse empréstimo → entrada de investimento."}, {"n": 10, "q": "Em relação às notas explicativas, analise o que se afirma a seguir:\n\nI. cálculos de depreciação, amortização e exaustão\nII. constituição de provisões para encargos ou riscos\nIII. ajustes para atender a perdas prováveis na realização de elementos do ativo\n\nDe acordo com a Lei nº 6.404/76 e alterações, as notas explicativas devem indicar os critérios de avaliação que se afirma em", "opts": ["(A) I, apenas.", "(B) I e II, apenas.", "(C) I e III, apenas.", "(D) II e III, apenas.", "(E) I, II e III."], "ans": 4, "res": "A Lei das S.A. exige divulgação de critérios de avaliação relevantes, incluindo os utilizados nos cálculos de depreciação, amortização e exaustão, na constituição de provisões para encargos ou riscos e nos ajustes para perdas prováveis na realização de ativos. Assim, I, II e III estão corretos. Alternativa E.", "peg": "A banca pode tentar fazer parecer que notas explicativas tratam apenas de critérios ligados diretamente aos ativos.", "mac": "NOTAS EXPLICATIVAS detalham CRITÉRIOS relevantes usados na mensuração e avaliação."}, {"n": 11, "q": "A Demonstração do Valor Adicionado deve proporcionar aos usuários das demonstrações contábeis informações relativas à riqueza criada pela entidade em determinado período e a forma como tais riquezas foram distribuídas.\n\nNa segunda parte da demonstração, é mostrada a distribuição do valor adicionado pelos grupos a seguir, com exceção de um. Assinale-o.", "opts": ["(A) Pessoal.", "(B) Impostos, taxas e contribuições.", "(C) Remuneração de Capitais Próprios.", "(D) Remuneração de capitais de terceiros.", "(E) Investimentos em sociedades controladas."], "ans": 4, "res": "A segunda parte da DVA evidencia a distribuição da riqueza entre pessoal, governo (impostos, taxas e contribuições), capitais de terceiros e capitais próprios. Investimentos em sociedades controladas não constituem grupo de distribuição do valor adicionado. Portanto, E.", "peg": "Memorize os destinatários da riqueza; a alternativa estranha fica evidente.", "mac": "DVA DISTRIBUI: Pessoal + Governo + Capital de Terceiros + Capital Próprio."}, {"n": 12, "q": "Uma conta que é apresentada na Demonstração das Mutações do Patrimônio Líquido e que afeta o total do patrimônio líquido: é o(a)", "opts": ["(A) aumento de capital social com a utilização de reservas.", "(B) reversão de reserva patrimonial para a conta de prejuízos acumulados.", "(C) reversão da reserva de lucros a realizar para a conta de dividendos a pagar.", "(D) transferência de valores de outros resultados abrangentes para o resultado do exercício.", "(E) apuração do lucro do período, antes do reconhecimento do imposto sobre a renda e contribuição social."], "ans": 2, "res": "A reversão de reserva de lucros a realizar para dividendos a pagar retira valor do patrimônio líquido e reconhece obrigação no passivo, reduzindo o total do PL. Já simples transferências entre contas internas do PL não alteram seu total. Portanto, C.", "peg": "Movimentar valor de uma conta do PL para outra pode alterar a composição sem alterar o total. Procure a operação que sai do PL.", "mac": "ENTRE contas do PL → total geralmente não muda. PL → PASSIVO → total do PL diminui."}, {"n": 13, "q": "Uma sociedade empresária adquiriu computadores no exterior para os seus empregados. O preço pago foi equivalente a R$10.000 e os impostos para importação foram de R$2.000.\n\nOs mesmos computadores poderiam ser adquiridos no Brasil por R$16.000.\n\nA sociedade empresária espera utilizar os computadores durante cinco anos e vendê-los por valor equivalente a R$3.000.\n\nAssinale a opção que indica a despesa de depreciação anual dos computadores.", "opts": ["(A) R$1.800.", "(B) R$2.000.", "(C) R$2.400.", "(D) R$3.200.", "(E) R$3.600."], "ans": 0, "res": "Custo inicial = preço pago R$10.000 + impostos de importação R$2.000 = R$12.000. O preço alternativo no Brasil de R$16.000 não é usado. Base depreciável = custo R$12.000 − valor residual R$3.000 = R$9.000. Depreciação anual linear = 9.000 ÷ 5 = R$1.800. Alternativa A.", "peg": "Não use o preço que seria pago no Brasil. O custo parte da aquisição efetivamente realizada e dos custos incorporáveis.", "mac": "DEPRECIAÇÃO = (CUSTO − RESIDUAL) ÷ VIDA ÚTIL = (12.000 − 3.000) ÷ 5 = 1.800."}, {"n": 14, "q": "De acordo com o Pronunciamento Técnico CPC 04- CPC 04 (R1)- Ativo Intangível, um ativo intangível pode ser ou não amortizado.\n\nA amortização depende de se o ativo reconhecido", "opts": ["(A) tem vida útil definida ou indefinida.", "(B) apresenta valor material ou imaterial.", "(C) foi adquirido à vista ou por meio de financiamento.", "(D) foi formado internamente ou adquirido de terceiros.", "(E) é utilizado na atividade operacional ou administrativa."], "ans": 0, "res": "A amortização do intangível depende da classificação de sua vida útil. Ativo intangível com vida útil definida é amortizado ao longo dessa vida útil. Ativo com vida útil indefinida não é amortizado, ficando sujeito às regras pertinentes de teste de recuperabilidade. Portanto, A.", "peg": "Indefinida não significa infinita; significa que não há limite previsível para o período de geração de fluxos líquidos de caixa.", "mac": "INTANGÍVEL: vida DEFINIDA → amortiza; vida INDEFINIDA → não amortiza."}, {"n": 15, "q": "Ao analisar as demonstrações contábeis de uma empresa industrial, um analista de investimentos verificou que a despesa com o uso das máquinas não foi identificada na demonstração do resultado do período.\n\nO tratamento contábil da empresa foi considerado correto. Nesse caso. pode-se concluir que:", "opts": ["(A) houve mudanças na vida útil das máquinas.", "(B) o valor residual das máquinas aumentou no período.", "(C) a empresa aprimorou o uso das máquinas no período.", "(D) a empresa somente reconhece as despesas que são pagas no período.", "(E) a despesa de depreciação faz parte do custo de outro ativo e foi incluída no seu valor contábil."], "ans": 4, "res": "Em uma indústria, a depreciação das máquinas utilizadas na produção pode compor o custo de produção de outro ativo, como estoques. Nesse caso, ela é inicialmente incorporada ao valor contábil desse ativo, em vez de aparecer imediatamente como despesa destacada no resultado. Logo, E.", "peg": "Depreciação nem sempre vai diretamente para a DRE no mesmo momento; pode ser capitalizada como parte do custo de outro ativo.", "mac": "MÁQUINA NA PRODUÇÃO → depreciação pode entrar no CUSTO DO ESTOQUE."}, {"n": 16, "q": "Em 31/12/2024 uma sociedade empresária apresentava, em seu balanço patrimonial, um terreno por R$ 150.000.\n\nNa realização do teste de redução ao valor recuperável, a entidade estimou o valor em uso do terreno em R$140.000. Já o seu valor justo era estimado em R$ 170.000, enquanto as despesas com a alienação foram estimadas em R$ 15.000.\n\nO valor do terreno no balanço patrimonial, após a realização do teste, foi de", "opts": ["(A) R$ 140.000.", "(B) R$ 150.000.", "(C) R$ 165.000.", "(D) R$ 170.000.", "(E) R$ 185.000."], "ans": 1, "res": "Passo 1: valor justo menos despesas de alienação = 170.000 − 15.000 = R$155.000. Passo 2: valor em uso = R$140.000. O valor recuperável é o MAIOR entre esses dois: R$155.000. Passo 3: compare com o valor contábil de R$150.000. Como o recuperável (155.000) é maior que o contábil, não há perda por impairment. O terreno permanece por R$150.000. Alternativa B.", "peg": "O valor recuperável não é automaticamente o valor que vai para o balanço. Só há redução se ele for MENOR que o valor contábil.", "mac": "RECUPERÁVEL = MAIOR(VIU; VJ líquido). Se recuperável ≥ contábil → SEM PERDA."}, {"n": 17, "q": "Uma sociedade empresarial adquiriu um ativo, com elementos tangíveis e intangíveis, para ser utilizado em sua atividade fim.\n\nDe acordo com o Pronunciamento Técnico CPC 04 (R1)- Ativo Intangível, para determinar se o ativo deve ser tratado como ativo imobilizado ou como ativo intangível, a entidade deve avaliar o elemento que", "opts": ["(A) apresenta maior vida útil.", "(B) apresenta maior valor residual.", "(C) apresenta maior valor monetário.", "(D) é mais significativo.", "(E) será utilizado de forma inicial na atuação da empresa."], "ans": 3, "res": "Quando um ativo contém elementos tangíveis e intangíveis, a entidade usa julgamento para determinar qual elemento é mais significativo. Esse elemento predominante orienta o tratamento como imobilizado ou intangível. Portanto, D.", "peg": "Não é necessariamente o componente de maior valor monetário ou maior vida útil que define a classificação.", "mac": "TANGÍVEL + INTANGÍVEL juntos → veja qual elemento é MAIS SIGNIFICATIVO."}, {"n": 18, "q": "Em março de 2025, uma empresa do setor de shopping center foi acionada na justiça por três clientes, por conta de diferentes problemas no estacionamento. Na primeira causa, pede-se R$ 10.000 e os advogados da empresa julgaram que a perda é possível. Na segunda causa, pede-se R$ 12.000 e os advogados da empresa julgaram que a perda é provável. Já a perda da terceira causa, que pede R$ 15.000, foi julgada pelos advogados da empresa como remota.\n\nAssinale a opção que indica a provisão para contingências relacionada às causas reconhecida no Balanço Patrimonial do shopping center", "opts": ["(A) R$ 10.000.", "(B) R$ 12.000.", "(C) R$ 15.000.", "(D) R$ 22.000.", "(E) R$ 27.000."], "ans": 1, "res": "Classifique cada causa: R$10.000 com perda possível → não reconhece provisão; R$12.000 com perda provável → reconhece provisão; R$15.000 com perda remota → não reconhece provisão. Assim, a provisão reconhecida é R$12.000. Alternativa B.", "peg": "Não some todas as causas. Primeiro classifique cada probabilidade.", "mac": "PERDA PROVÁVEL → PROVISIONA. POSSÍVEL → divulga. REMOTA → em regra, nada."}, {"n": 19, "q": "Uma sociedade empresária reconheceu um ativo contingente, cujo ganho era considerado possível, em seu ativo realizável a longo prazo por R$ 10.000, que era o seu valor estimado.\n\nO auditor afirmou que o procedimento estava incorreto, uma vez que o ativo contingente", "opts": ["(A) não deve ser reconhecido.", "(B) deve ser reconhecido como receita.", "(C) deve ser reconhecido como ativo circulante.", "(D) não deve ser reconhecido pelo valor estimado.", "(E) deve ser reconhecido apenas quando o ganho é provável."], "ans": 0, "res": "Ativos contingentes não são reconhecidos nas demonstrações contábeis enquanto permanecerem contingentes. Um ganho apenas possível não deve ser registrado como ativo. Portanto, o procedimento estava incorreto porque o ativo contingente não deve ser reconhecido. Alternativa A.", "peg": "Probabilidade de ganho e reconhecimento de ativo contingente não seguem exatamente a lógica das provisões para perdas.", "mac": "ATIVO CONTINGENTE → NÃO RECONHECE enquanto contingente; entrada provável pode exigir divulgação, conforme o caso."}, {"n": 20, "q": "Em 31/12/2023, uma loja de roupas, que comercializa uma grande quantidade de itens, apresentou, em sua Demonstração do Resultado, custo das mercadorias vendidas de R$ 300.000.\n\nEm 31/12/2024, a loja mudou a política contábil de avaliação do estoque, por julgar que poderia obter informação mais confiável e relevante. Ao elaborar as demonstrações de 31/12/2023 de acordo com a nova política, para efeito de comparação, constatou que o custo das mercadorias vendidas seria de R$ 280.000.\n\nConsiderando que a loja é localizada em um país inflacionário, pode-se concluir que o estoque era avaliado, antes e depois da mudança da política, respectivamente pelo método:", "opts": ["(A) PEPS- Custo Médio.", "(B) Custo Médio- PEPS.", "(C) PEPS- Identificação Específica.", "(D) Custo Médio- Identificação Específica.", "(E) Identificação Específica- Custo Médio."], "ans": 1, "res": "Em ambiente de preços crescentes, o PEPS tende a levar ao CMV os custos mais antigos e menores, produzindo CMV menor do que métodos que incorporam custos médios mais recentes. O CMV antigo era R$300.000 e, pela nova política, passou a R$280.000. Assim, a mudança compatível entre as alternativas é de Custo Médio para PEPS. Alternativa B.", "peg": "A pista 'país inflacionário' é essencial para comparar o comportamento do CMV entre métodos.", "mac": "PREÇOS SUBINDO: PEPS → custos antigos no CMV → CMV tende a ser MENOR."}, {"n": 21, "q": "De acordo com o Pronunciamento Técnico CPC 24- Evento Subsequente, os eventos podem ser identificados como eventos que originam ajustes e eventos que não originam ajustes.\n\nUma diferença entre os dois tipos de evento é o fato de que", "opts": ["(A) o montante envolvido é considerado material ou imaterial.", "(B) o resultado esperado é favorável ou desfavorável à entidade.", "(C) a opinião do auditor independente é modificada ou não modificada.", "(D) as condições evidenciadas existiam ou não na data final do período a que se referem as demonstrações contábeis.", "(E) o efeito do evento é de curto ou de longo prazo."], "ans": 3, "res": "A distinção fundamental é a existência da condição na data de encerramento. Evento subsequente que fornece evidência de condição já existente no fim do período origina ajuste. Se a condição surgiu somente depois do encerramento, em regra não origina ajuste, embora possa exigir divulgação se material. Logo, D.", "peg": "Não é o tamanho, o sinal favorável/desfavorável ou o prazo que define se haverá ajuste.", "mac": "EVENTO SUBSEQUENTE: condição JÁ EXISTIA no fechamento? → AJUSTA."}, {"n": 22, "q": "De acordo com o Pronunciamento Técnico CPC 28- Propriedade para Investimento, propriedade para investimento é a propriedade mantida para auferir aluguel ou para valorização do capital ou para ambas.\n\nDe acordo com o pronunciamento, esses ativos devem ser inicialmente mensurados pelo", "opts": ["(A) valor justo.", "(B) valor estimado de uso.", "(C) valor realizável líquido.", "(D) custo histórico.", "(E) custo de reposição."], "ans": 3, "res": "A propriedade para investimento é mensurada inicialmente pelo custo, incluindo custos de transação pertinentes. Entre as alternativas, isso corresponde ao custo histórico. A escolha posterior entre modelos previstos pelo pronunciamento não altera a regra de mensuração inicial. Alternativa D.", "peg": "A banca usa 'valor justo' porque ele é importante na mensuração posterior, mas a pergunta é sobre mensuração INICIAL.", "mac": "PROPRIEDADE PARA INVESTIMENTO: INÍCIO = CUSTO."}, {"n": 23, "q": "Em relação ao custo de empréstimo obtido de uma instituição financeira, avalie, de acordo com o Pronunciamento Técnico CPC 20 (R1) - Custos de Empréstimos, se fazem parte do custo do ativo qualificável, os custos de empréstimo diretamente atribuíveis aos seguintes itens:\n\nI. Construção do ativo qualificável\nII. Aquisição do ativo qualificável\nIII. Alienação do ativo qualificável\n\nEstá correto o que se apresenta em:", "opts": ["(A) I, apenas.", "(B) I e II, apenas.", "(C) I e III, apenas.", "(D) II e III, apenas.", "(E) I, II e III."], "ans": 1, "res": "Custos de empréstimos diretamente atribuíveis à aquisição ou à construção/produção de um ativo qualificável são capitalizados como parte de seu custo, quando atendidos os requisitos. A alienação do ativo não é hipótese de formação do custo qualificável. Portanto, I e II: alternativa B.", "peg": "ALIENAÇÃO é venda/saída do ativo, não processo de aquisição, construção ou produção do ativo qualificável.", "mac": "CPC 20: custos diretamente atribuíveis à AQUISIÇÃO/CONSTRUÇÃO/PRODUÇÃO do qualificável → capitaliza."}, {"n": 24, "q": "A Cia A é controladora da Cia B, com 90% de participação.\n\nDe acordo com o Pronunciamento Técnico CPC 36 (R3)- Demonstrações Consolidadas, a Cia A deve apresentar as participações de não controladores no balanço patrimonial", "opts": ["(A) individual, no ativo.", "(B) individual, no passivo.", "(C) consolidado, no passivo.", "(D) individual, no patrimônio líquido.", "(E) consolidado, no patrimônio líquido."], "ans": 4, "res": "Participações de não controladores surgem no contexto das demonstrações consolidadas e são apresentadas no patrimônio líquido, separadamente do patrimônio líquido atribuível aos proprietários da controladora. Logo, alternativa E.", "peg": "Não controladores não são passivo. Eles representam participação patrimonial na controlada consolidada.", "mac": "PNC → BALANÇO CONSOLIDADO → PATRIMÔNIO LÍQUIDO."}, {"n": 25, "q": "A Cia ABC, que atua como arrendadora de equipamentos pesados para construção de estradas, realizou o arrendamento de um equipamento, cuja vida econômica era estimada em 25 anos, por R$400.000. O prazo do arrendamento é de 23 anos.\n\nDe acordo com o Pronunciamento Técnico CPC 06 (R2)– Arrendamentos, a situação normalmente levaria o arredamento a ser classificado como", "opts": ["(A) reverso.", "(B) operacional.", "(C) financeiro.", "(D) de investimento.", "(E) de financiamento."], "ans": 2, "res": "O prazo do arrendamento é 23 anos diante de vida econômica de 25 anos, abrangendo a maior parte da vida econômica do ativo. Esse é um forte indicador de transferência substancial dos riscos e benefícios, levando normalmente, para a arrendadora, à classificação como arrendamento financeiro. Alternativa C.", "peg": "Não precisa haver transferência formal da propriedade para que um arrendamento seja financeiro.", "mac": "ARRENDAMENTO pega MAIOR PARTE da vida econômica → forte sinal de FINANCEIRO."}, {"n": 26, "q": "De acordo com o Pronunciamento Técnico CPC 07 (R1)- Subvenção e Assistência Governamentais, até que os requisitos para reconhecimento de uma subvenção governamental como receita na demonstração do resultado sejam atendidos, a contrapartida da subvenção governamental registrada no ativo deve ser feita em conta específica", "opts": ["(A) de ajuste.", "(B) de ganhos.", "(C) de despesa.", "(D) do passivo.", "(E) do patrimônio líquido."], "ans": 3, "res": "Enquanto não forem atendidos os requisitos para reconhecimento da subvenção como receita, a contrapartida do ativo reconhecido deve permanecer em conta específica do passivo. Posteriormente, quando satisfeitas as condições pertinentes, ocorre o reconhecimento da receita de forma apropriada. Alternativa D.", "peg": "Não leve a subvenção diretamente ao patrimônio líquido ou ao resultado antes do atendimento das condições de reconhecimento.", "mac": "SUBVENÇÃO antes de virar RECEITA → contrapartida no PASSIVO."}, {"n": 27, "q": "De acordo com a NBC TG 25 (R2) - PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES, provisão é um passivo de prazo incerto ou de valor incerto.\n\nConsidere que a sociedade empresária Beta tenha recebido laudo de seu advogado sobre um provável pagamento de processo trabalhista, entretanto com mensuração ainda não confiável.\n\nNesse caso, o seu reconhecimento nas demonstraçõesfinanceiras deve ser", "opts": ["(A) como apropriação por competência no balanço patrimonial.", "(B) como provisão trabalhista no balanço patrimonial.", "(C) não realizar reconhecimento de provisão trabalhista no balanço patrimonial e não divulgar em nota explicativa.", "(D) não realizar reconhecimento de provisão trabalhista no balanço patrimonial, mas divulgar em nota explicativa como passivo contingente."], "ans": 3, "res": "A saída de recursos foi julgada provável, mas não existe mensuração confiável. Como uma provisão exige estimativa confiável, ela não deve ser reconhecida no balanço. A situação é divulgada como passivo contingente, conforme a alternativa D.", "peg": "A palavra 'provável' não encerra a análise. Ainda é preciso verificar a possibilidade de estimar confiavelmente o valor.", "mac": "PROVISÃO = provável + mensuração confiável. Sem mensuração confiável → não reconhece provisão."}, {"n": 28, "q": "A Demonstração do Valor Adicionado proporciona aos usuários das demonstrações contábeis informações relativas à riqueza criada pela entidade em determinado período e à forma como tais riquezas foram distribuídas.\n\nNa distribuição do valor adicionado, o total de “Remuneração de capitais próprios” deve ser igual", "opts": ["(A) às reservas de lucro reportadas no Balanço Patrimonial.", "(B) ao pagamento de dividendos reportado na Demonstração dos Fluxos de Caixa.", "(C) ao resultado líquido do exercício reportado na Demonstração do Resultado do Período.", "(D) à distribuição de dividendos reportada na Demonstração das Mutações do Patrimônio Líquido."], "ans": 2, "res": "Na estrutura da DVA trabalhada pela questão, a remuneração de capitais próprios contempla a riqueza destinada aos proprietários, incluindo parcelas distribuídas e retidas. O total se relaciona ao resultado líquido do exercício apresentado na Demonstração do Resultado. Portanto, C.", "peg": "Não reduza remuneração de capitais próprios apenas aos dividendos pagos.", "mac": "CAPITAL PRÓPRIO na DVA = parcela do resultado destinada aos proprietários, distribuída ou retida."}, {"n": 29, "q": "Uma loja que vende produtos de escritório apresentava os seguintessaldos em 31/12/2023:\n• Custo da mercadoria vendida (inclui os valores dos impostos recuperáveis): R$ 80.000,00\n• Despesa de depreciação dos ativos imobilizados: R$ 15.000,00\n• Perdas estimadas com crédito de liquidação duvidosa: R$ 6.000,00\n• Perdas por desvalorização dos ativos imobilizados: R$ 10.000,00\n• Receita de contrato com clientes: R$ 200.000,00\n\nAssinale a opção que indica o saldo do valor adicionado líquido produzido pela loja, apresentado em sua Demonstração do Valor Adicionado em 31/12/2023.", "opts": ["(A) R$ 89.000,00.", "(B) R$ 114.000,00.", "(C) R$ 104.000,00.", "(D) R$ 194.000,00."], "ans": 0, "res": "Receita ajustada pela perda estimada: 200.000 − 6.000 = R$194.000. Subtraia o CMV de R$80.000: valor adicionado bruto = R$114.000. Depois subtraia retenções: depreciação R$15.000 + perda por desvalorização do imobilizado R$10.000 = R$25.000. Valor adicionado líquido = 114.000 − 25.000 = R$89.000. Alternativa A.", "peg": "Não pare no valor adicionado bruto de R$114.000. A pergunta pede o valor adicionado LÍQUIDO.", "mac": "DVA: RECEITAS − INSUMOS = VA BRUTO; − RETENÇÕES = VA LÍQUIDO."}, {"n": 30, "q": "Conforme a NBC TG 04 (R4) – ATIVO INTANGÍVEL, não são exemplos de gastos a serem reconhecidos como despesa aqueles incorridos com", "opts": ["(A) atividades pré-operacionais destinadas a constituir a empresa.", "(B) treinamento do pessoal próprio.", "(C) publicidade e atividades promocionais.", "(D) o desenvolvimento de ativos intangíveis gerados internamente."], "ans": 3, "res": "O comando contém uma negação: procura o item que NÃO é simplesmente exemplo de gasto reconhecido como despesa. Atividades pré-operacionais, treinamento e publicidade/promocionais são exemplos de gastos reconhecidos como despesa. Já gastos na fase de desenvolvimento de intangível gerado internamente podem ser reconhecidos como ativo quando os critérios da norma forem satisfeitos. Portanto, D.", "peg": "O 'não' do enunciado é a principal pegadinha. Leia o comando duas vezes.", "mac": "PESQUISA e vários gastos gerais → despesa; DESENVOLVIMENTO → pode virar ativo se cumprir os critérios."}]; let idx=0, mode='q'; let state=Q.map(()=>({sel:null,done:false}));
const card=document.getElementById('card'), score=document.getElementById('score'), bar=document.getElementById('bar');
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
 let x=Q[idx], st=state[idx]; bar.style.width=((idx+1)/Q.length*100)+'%';
 let hits=state.filter((s,i)=>s.done&&s.sel===Q[i].ans).length; score.textContent=`Questão ${idx+1} de ${Q.length} • Acertos: ${hits}`;
 if(mode==='q'){
  card.innerHTML=`<span class="badge">QUESTÃO ${String(x.n).padStart(2,'0')}</span><div class="q">${esc(x.q)}</div>
  <div id="opts">${x.opts.map((o,i)=>`<button class="opt ${st.sel===i?'sel':''} ${st.done&&i===x.ans?'correct':''} ${st.done&&st.sel===i&&i!==x.ans?'wrong':''}" data-i="${i}" ${st.done?'disabled':''}>${esc(o)}</button>`).join('')}</div>
  <button class="action" id="confirm" ${st.sel===null||st.done?'disabled':''}>${st.done?'RESPOSTA CONFIRMADA':'CONFIRMAR RESPOSTA'}</button>
  ${st.done ? (st.sel===x.ans
    ? '<div class="feedbackLamp good">🟢 RESPOSTA CORRETA!</div>'
    : '<div class="feedbackLamp bad">🔴 RESPOSTA ERRADA!</div>') : ''}
  ${st.done?'<button class="action" id="solution">VER RESOLUÇÃO DETALHADA →</button>':''}`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{state[idx].sel=+b.dataset.i;render()});
  let c=document.getElementById('confirm'); if(c&&!st.done)c.onclick=()=>{state[idx].done=true;render()};
  let s=document.getElementById('solution'); if(s)s.onclick=()=>{mode='r';render()};
 } else {
  card.innerHTML=`<span class="badge">RESOLUÇÃO — QUESTÃO ${String(x.n).padStart(2,'0')}</span>
  <div class="answer">✅ Gabarito: ${esc(x.opts[x.ans])}</div>
  <div class="box step"><b>🔎 RESOLUÇÃO PASSO A PASSO</b><div class="result">${esc(x.res)}</div></div>
  <div class="box trap"><b>⚠️ PEGADINHA DE PROVA</b><div class="result">${esc(x.peg)}</div></div>
  <div class="box tip"><b>🧠 MACETE PARA DECORAR</b><div class="result">${esc(x.mac)}</div></div>
  <button class="action" id="backq">← VOLTAR À QUESTÃO</button>`;
  document.getElementById('backq').onclick=()=>{mode='q';render()};
 }
}
document.getElementById('prev').onclick=()=>{if(mode==='r'){mode='q'}else if(idx>0)idx--; render()};
document.getElementById('next').onclick=()=>{if(mode==='r'){if(idx<Q.length-1){idx++;mode='q'}}else if(state[idx].done){mode='r'}; render()};
document.getElementById('reset').onclick=()=>{if(confirm('Reiniciar todo o quiz?')){idx=0;mode='q';state=Q.map(()=>({sel:null,done:false}));render()}};
render();
</script></body></html>
